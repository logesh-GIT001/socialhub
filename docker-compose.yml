version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: socialhub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: socialhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: socialhub_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: socialhub_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - SECRET_KEY=supersecretjwtkeychangeinproduction1234567890
      - ENCRYPTION_KEY=32_character_long_secret_key_123
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/socialhub
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/workspace/storage
    depends_on:
      - db
      - redis
    volumes:
      - backend_storage:/workspace/storage

  celery_worker:
    build: ./backend
    container_name: socialhub_worker
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - SECRET_KEY=supersecretjwtkeychangeinproduction1234567890
      - ENCRYPTION_KEY=32_character_long_secret_key_123
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/socialhub
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/workspace/storage
    depends_on:
      - db
      - redis
    volumes:
      - backend_storage:/workspace/storage

  celery_beat:
    build: ./backend
    container_name: socialhub_beat
    restart: always
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - SECRET_KEY=supersecretjwtkeychangeinproduction1234567890
      - ENCRYPTION_KEY=32_character_long_secret_key_123
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/socialhub
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/workspace/storage
    depends_on:
      - db
      - redis
    volumes:
      - backend_storage:/workspace/storage

  frontend:
    build: ./frontend
    container_name: socialhub_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
